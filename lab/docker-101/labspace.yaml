  - title: "Run Your First Web Server"
    contentPath: 02-first-web-server.md
  - title: "Run a Database"
    contentPath: 03-run-a-database.md
  - title: "Meet the Product Catalog"
    contentPath: 06-product-catalog.md
  - title: "Build & Run with Compose"
    contentPath: 07-build-and-compose.md
  - title: "Test the App"
    contentPath: 08-test.md
  - title: "Scan for Vulnerabilities"
    contentPath: 09-scan.md
  - title: "Harden It with DHI"
    contentPath: 10-harden-dhi.md
  - title: Conclusion
    contentPath: 11-conclusion.md

# $$name$$ in markdown is replaced with these values.
variables:
  repo: "https://github.com/dockersamples/catalog-service-node"
