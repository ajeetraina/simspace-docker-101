title: "Docker 101"
description: >
  Your first hours with Docker, entirely in the browser. Run containers, publish
  ports, and work with images - then take a real Node.js app, the Product Catalog
  service (Postgres, Kafka, LocalStack, WireMock), all the way through the SDLC:
  clone, build, run with Compose, test, scan for vulnerabilities with Docker Scout,
  and harden it with Docker Hardened Images until the vulnerability count is
  near-zero. Every command is simulated, so nothing breaks and there is nothing to
  install.

# Landing-page card. `order: 2` puts the hands-on lab after the slides deck.
# labs.json is GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: sailing
  order: 2
  tags: ["docker", "containers", "compose", "scout", "dhi", "sdlc"]
  estimatedMinutes: 90

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal for the whole lab. It's a single virtual machine and filesystem.
terminals:
  - id: main
    title: Terminal
    icon: terminal

# Seed the virtual filesystem with the Product Catalog source (the
# dockersamples/catalog-service-node app). Built-in ls/cat reflect these
# immediately; the `git clone` in Section 6 is cosmetic - the files are already
# here - and the hardened Dockerfile you write in Section 10 is added on top.
files:
  README.md: |
    # catalog-service-node

    Product Catalog service: a REST API over a PostgreSQL product database, wired
    to Kafka (events), LocalStack (S3 uploads) and WireMock (an upstream pricing
    API), with a small React frontend. It ships a Dockerfile and a compose.yaml so
    you can build and run the whole stack.

    Layout:
      backend    src/            Express API (Node.js)
      frontend   frontend/       React SPA (Vite)
      database   db/schema.sql   PostgreSQL schema + seed data

    Run the stack:  docker compose up -d
    API:            http://localhost:3000/api/products
    Web client:     http://localhost:5173
  package.json: |
    {
      "name": "catalog-service-node",
      "version": "1.0.0",
      "description": "Product Catalog REST API over Postgres, with Kafka, LocalStack (S3) and WireMock",
      "main": "src/index.js",
      "scripts": {
        "start": "node src/index.js",
        "dev": "nodemon src/index.js",
        "unit-test": "vitest run test/unit",
        "integration-test": "vitest run test/integration"
      },
      "dependencies": {
        "express": "^4.19.2",
        "pg": "^8.11.5",
        "kafkajs": "^2.2.4",
        "@aws-sdk/client-s3": "^3.588.0",
        "axios": "^1.7.2"
      },
      "devDependencies": {
        "nodemon": "^3.1.0",
        "vitest": "^1.6.0",
        "testcontainers": "^10.9.0"
      }
    }
  package-lock.json: |
    { "name": "catalog-service-node", "lockfileVersion": 3, "requires": true, "packages": {} }
  src/index.js: |
    const express = require("express");
    const products = require("./routes/products");

    const app = express();
    app.use(express.json());
    app.use("/api/products", products);

    app.listen(3000, () => console.log("catalog-service listening on :3000"));
  src/routes/products.js: |
    const { Router } = require("express");
    const ProductService = require("../services/ProductService");

    const router = Router();

    router.get("/", async (_req, res) => res.json(await ProductService.getProducts()));
    router.get("/:id", async (req, res) => {
      const product = await ProductService.getProductById(req.params.id);
      if (!product) return res.status(404).json({ error: "not found" });
      res.json(product);
    });

    module.exports = router;
  src/services/ProductService.js: |
    const { pool } = require("../db/pool");
    const { publish } = require("../events/kafka");

    async function getProducts() {
      const { rows } = await pool.query("SELECT * FROM products ORDER BY id");
      return rows;
    }

    async function getProductById(id) {
      const { rows } = await pool.query("SELECT * FROM products WHERE id = $1", [id]);
      return rows[0];
    }

    async function createProduct(p) {
      const { rows } = await pool.query(
        "INSERT INTO products (name, sku, price) VALUES ($1,$2,$3) RETURNING *",
        [p.name, p.sku, p.price]
      );
      // Publish a "product created" event. NOTE: the UPC field is missing here.
      await publish("products", { id: rows[0].id, name: rows[0].name, sku: rows[0].sku });
      return rows[0];
    }

    module.exports = { getProducts, getProductById, createProduct };
  src/db/pool.js: |
    const { Pool } = require("pg");
    const pool = new Pool({ connectionString: process.env.DATABASE_URL });
    module.exports = { pool };
  src/events/kafka.js: |
    const { Kafka } = require("kafkajs");
    const kafka = new Kafka({ brokers: [process.env.KAFKA_BROKER || "kafka:9092"] });
    const producer = kafka.producer();

    async function publish(topic, message) {
      await producer.send({ topic, messages: [{ value: JSON.stringify(message) }] });
    }
    module.exports = { producer, publish };
  db/schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id    SERIAL PRIMARY KEY,
      name  TEXT NOT NULL,
      sku   TEXT UNIQUE NOT NULL,
      price NUMERIC(10, 2) NOT NULL DEFAULT 0
    );

    INSERT INTO products (name, sku, price) VALUES
      ('Widget', 'WGT-001', 9.99),
      ('Gadget', 'GDG-002', 19.99)
    ON CONFLICT (sku) DO NOTHING;
  frontend/package.json: |
    {
      "name": "catalog-frontend",
      "version": "1.0.0",
      "private": true,
      "scripts": { "dev": "vite", "build": "vite build" },
      "dependencies": { "react": "^18.3.1", "react-dom": "^18.3.1" },
      "devDependencies": { "vite": "^5.2.0" }
    }
  frontend/src/App.jsx: |
    import { useEffect, useState } from "react";
    export default function App() {
      const [products, setProducts] = useState([]);
      useEffect(() => { fetch("/api/products").then((r) => r.json()).then(setProducts); }, []);
      return (
        <main>
          <h1>Product Catalog</h1>
          <ul>{products.map((p) => <li key={p.id}>{p.name} - ${p.price}</li>)}</ul>
        </main>
      );
    }
  Dockerfile: |
    # Baseline image the project ships with. It works - but it's big and built on a
    # full node:20 base, so it carries a lot of packages (and CVEs). You harden it
    # in Section 10.
    FROM node:20

    WORKDIR /usr/src/app
    COPY package*.json ./
    RUN npm install --production
    COPY . .

    EXPOSE 3000
    CMD ["node", "src/index.js"]
  compose.yaml: |
    services:
      backend:
        build: .
        ports: ["3000:3000"]
        environment:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/catalog
          KAFKA_BROKER: kafka:9092
          AWS_ENDPOINT: http://localstack:4566
          CATALOG_UPSTREAM: http://wiremock:8080
        depends_on: [postgres, kafka, localstack, wiremock]

      frontend:
        build: ./frontend
        ports: ["5173:5173"]
        depends_on: [backend]

      postgres:
        image: postgres:16
        environment:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog

      kafka:
        image: confluentinc/cp-kafka:7.6.0

      localstack:
        image: localstack/localstack:3
        environment: { SERVICES: s3 }

      wiremock:
        image: wiremock/wiremock:3.5.4

      pgadmin:
        image: dpage/pgadmin4
        ports: ["5050:80"]

      kafka-ui:
        image: provectuslabs/kafka-ui
        ports: ["8080:8080"]

